; UESTC 校园网认证 —— 个人配置模板
;
; 用法：把本文件复制一份、改名为 config.ini，然后填上你自己的学号和密码。
;
;     copy config.example.ini config.ini
;
; config.ini 已经被 .gitignore 忽略，不会被提交到仓库，放心填真实密码。
;
; 注意：注释只能单独占一行。不要写成 "password = abc  ; 我的密码" 这种行尾注释 ——
;       密码里可能包含 ; 或 #，行尾注释会把密码截断，导致登录莫名失败。

[account]

; 学号
username = 202912272625

; 教务处密码
password = your_password

; 网络提供商： 电信 @dx / 移动 @cmcc / 校园网 @dx-uestc
domain = @dx


[portal]

; 认证页面的地址
;   寝室公寓(硕丰 6/7/8 组团那种)：http://10.253.0.235
;   主楼有线校园网：               http://10.253.0.237
url = http://10.253.0.235

; 认证页面地址里的 ac_id 参数，把上面的 url 粘到浏览器里就能看到
;   寝室公寓：3
;   主楼有线校园网：1
ac_id = 3


[monitor]

; 用这个 IP 判断当前有没有联网(ping 得通就算在线)。
;
; 这个探测点必须真的回 ICMP。很多 DNS 服务器是屏蔽 ping 的，
; 一旦探测点不通，程序就会一直以为断网(即使你其实在线)，然后反复重登 —— 实测
; 114.114.114.114 在电子科大宿舍网上就是 100% 丢包，所以别用它。
; 223.5.5.5(阿里 DNS)、119.29.29.29(腾讯 DNS) 实测可以。
test_ip = 223.5.5.5

; 掉线检测间隔(秒)，一般不用改
delay = 16

; 连续 ping 失败多少次才认为断网，一般不用改
max_failed = 3
